name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      vscode-version: ${{ steps.vscode.outputs.version }}
      vscode-minimum: ${{ steps.vscode.outputs.minimum }}
    steps:
      - name: Check out repository and release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Check release tag, version, and main branch
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          TAG_CREATED: ${{ github.event.created }}
        run: |
          node scripts/check-release.mjs
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Test release safeguards
        run: node --test tests/release/*.test.mjs

      - name: Prepare release changelog
        run: node scripts/release-notes.mjs > release-notes.md

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Read supported VS Code test versions
        id: vscode
        run: |
          node -e 'const p = require("./package.json"); console.log(`version=${p.config.vscodeTestVersion}`); console.log(`minimum=${p.engines.vscode.replace(/^\^/, "")}`)' >> "$GITHUB_OUTPUT"

      - name: Test dependency and packaging contracts
        run: npm run test:dependencies

      - name: Package extension
        run: npm run package -- --out extension.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stlcpp-vsix
          path: |
            extension.vsix
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  editor-tests:
    name: Editor tests on ${{ matrix.os }} (VS Code ${{ matrix.vscode }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['${{ needs.build.outputs.vscode-version }}']
        include:
          - os: ubuntu-latest
            vscode: ${{ needs.build.outputs.vscode-minimum }}
    steps:
      - name: Check out tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install test tools
        run: npm ci

      - name: Download the built VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stlcpp-vsix
          path: artifacts

      - name: Test the installed VSIX on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension -- --vsix artifacts/extension.vsix --version ${{ matrix.vscode }}

      - name: Test the installed VSIX on macOS and Windows
        if: runner.os != 'Linux'
        run: npm run test:extension -- --vsix artifacts/extension.vsix --version ${{ matrix.vscode }}

      - name: Upload VS Code logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-test-logs-${{ matrix.os }}-${{ matrix.vscode }}
          path: .vscode-test/run-*/user-data/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to ${{ matrix.registry }}
    needs: [build, release]
    if: >-
      github.repository == 'aalto-opencs/vscode-stlcpp' &&
      needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: [vscode, open-vsx]
    steps:
      - name: Check out publishing tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # Publishing jobs do not restore caches populated by build jobs.

      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download the tested VSIX and changelog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stlcpp-vsix
          path: artifacts

      - name: Publish to Visual Studio Marketplace with OIDC
        if: matrix.registry == 'vscode'
        run: ./node_modules/.bin/vsce publish --oidc --packagePath artifacts/extension.vsix

      - name: Publish to Open VSX with OIDC
        if: matrix.registry == 'open-vsx'
        run: ./node_modules/.bin/ovsx publish artifacts/extension.vsix --trusted-publishing

  release:
    name: Create GitHub Release
    needs: [build, editor-tests]
    if: >-
      github.repository == 'aalto-opencs/vscode-stlcpp' &&
      needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tested VSIX and changelog
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stlcpp-vsix

      - name: Create GitHub Release with changelog and VSIX
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: extension.vsix
          fail_on_unmatched_files: true
          name: STLC++ ${{ github.ref_name }}
          body_path: release-notes.md
