name: Build and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Manual runs only validate and package; publishing requires a tag push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository and release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Check release tag, version, and main branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.mjs

      - name: Test release safeguards
        run: node --test tests/release/*.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Test dependency and packaging contracts
        run: npm run test:dependencies

      - name: Package extension
        run: npm run package -- --out extension.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stlcpp-vsix
          path: extension.vsix
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to ${{ matrix.registry }}
    needs: build
    if: >-
      github.repository == 'aalto-opencs/vscode-stlcpp' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: [vscode, open-vsx]
    steps:
      - name: Check out publishing tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # Publishing jobs do not restore caches populated by build jobs.

      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Download the tested VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stlcpp-vsix
          path: artifacts

      - name: Publish to Visual Studio Marketplace with OIDC
        if: matrix.registry == 'vscode'
        run: ./node_modules/.bin/vsce publish --oidc --packagePath artifacts/extension.vsix

      - name: Publish to Open VSX with OIDC
        if: matrix.registry == 'open-vsx'
        run: ./node_modules/.bin/ovsx publish artifacts/extension.vsix --trusted-publishing

  release:
    name: Create GitHub Release
    needs: build
    if: >-
      github.repository == 'aalto-opencs/vscode-stlcpp' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tested VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stlcpp-vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: extension.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
